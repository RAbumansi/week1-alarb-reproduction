name: ALARB verification
on:
  push:
  pull_request:
jobs:
  clean-machine:
    name: Fresh download (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run the README command from a clean directory
        run: python run_project.py
      - name: Save the reproduced metrics
        uses: actions/upload-artifact@v4
        with:
          name: fresh-machine-${{ matrix.os }}
          path: runs/fresh-machine/results.json
          if-no-files-found: error

  synthetic-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install lightweight test dependencies
        run: pip install pytest==9.1.1 pyarrow==25.0.1 numpy==2.5.3 scikit-learn==1.9.1
      - name: Check agent boundaries and recovery using synthetic fixtures
        run: python -m pytest tests/test_upgrades.py tests/test_colab_demo.py -q
